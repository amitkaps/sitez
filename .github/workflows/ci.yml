name: CI

on:
  push:
    branches: [main]
  # A label added or taken off runs it again, for the check below.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, named `ci`, so branch protection can require one check.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      # @prose
      # # One label
      #
      # A package's release notes are grouped by the label on each pull request, so a pull request
      # without one can't merge. The labels are the ones its `.github/release.yml` names, which only
      # a package has, so a site or a tool skips this. It runs before the install, to fail fast.
      - name: Label
        if: github.event_name == 'pull_request' && hashFiles('.github/release.yml') != ''
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          node -e '
            const notes = require("node:fs").readFileSync(".github/release.yml", "utf8");
            const known = [...notes.matchAll(/labels: \[(\w+)\]|^ +- (\w+)$/gm)].map((m) => m[1] ?? m[2]);
            const have = JSON.parse(process.env.LABELS).filter((label) => known.includes(label));
            if (have.length !== 1) {
              const found = have.length ? have.join(", ") : "none";
              console.error(`::error::Label this pull request with one of ${known.join(", ")}. It has ${found}.`);
              process.exit(1);
            }
          '

      - run: pnpm install --frozen-lockfile

      # check, test and build, with publint inside the build. The same script releases run.
      - name: Verify
        run: pnpm run verify

      # The package as npm would ship it, installed into a copy of the blog example: catches a
      # file missing from `files` or a dependency only the repo has, before a release does.
      # Outside the repository, since npm refuses to run where `devEngines` names pnpm.
      - name: Install the packed tarball in a site
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          cp -R tests/sites/blog "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          tgz="$(ls "$RUNNER_TEMP"/amitkaps-sitez-*.tgz)"
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json")); p.devDependencies["@amitkaps/sitez"] = "file:" + process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(p))' "$tgz"
          printf 'import sitez from "@amitkaps/sitez/vite";\n\nexport default { plugins: [sitez()] };\n' > vite.config.js
          npm install --no-audit --no-fund
          npx vp build
