# pnpm 12 reads project settings from here (moved out of .npmrc).
minimumReleaseAgeExclude:
  - "@amitkaps/markz@0.2.0"

# Use Vite+'s bundled Vite implementation for every `vite` consumer.
# Bump this alongside the `vite-plus` dependency.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.0.0"

# Vite+'s Vite implementation is exposed through an npm alias, so
# pnpm cannot validate it against normal `vite` peer ranges.
peerDependencyRules:
  allowAny:
    - vite
